{% extends "base.html" %}

{% block content %}
<div class="dashboard">
    <!-- Analytics Section -->
    <div class="analytics-section">
        <div class="stat-card">
            <h3>Total Tasks</h3>
            <div class="stat-value" id="stat-total">0</div>
        </div>
        <div class="stat-card">
            <h3>Completed</h3>
            <div class="stat-value text-success" id="stat-completed">0</div>
        </div>
        <div class="stat-card">
            <h3>Pending</h3>
            <div class="stat-value text-warning" id="stat-pending">0</div>
        </div>
        <div class="stat-card">
            <h3>Completion</h3>
            <div class="stat-value" id="stat-percentage">0%</div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Add Task Form -->
        <div class="card add-task-card">
            <h2><i class="fas fa-plus-circle"></i> Add New Task</h2>
            <form id="task-form">
                <input type="hidden" id="task-id">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="task-title" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="task-desc" rows="3"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Priority</label>
                        <select id="task-priority">
                            <option value="High">High</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="Low">Low</option>
                        </select>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="submit-btn">Add Task</button>
                    <button type="button" class="btn btn-secondary" id="cancel-btn" style="display:none;" onclick="resetForm()">Cancel</button>
                </div>
            </form>
        </div>

        <!-- Task List -->
        <div class="card task-list-card">
            <h2><i class="fas fa-list"></i> Your Tasks</h2>
            <div id="task-list" class="task-list">
                <!-- Tasks will be injected here via JS -->
                <div class="loading">Loading tasks...</div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
